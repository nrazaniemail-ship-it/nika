name: Validate Nika web app
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
      - '.github/workflows/validate-web.yml'
  workflow_dispatch:
concurrency:
  group: nika-web-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          if len(scripts) != 1:
              raise SystemExit(f'Expected one inline script, found {len(scripts)}')
          Path('/tmp/nika-inline.js').write_text(scripts[0], encoding='utf-8')
          print(f'Extracted {len(scripts[0])} JavaScript characters')
          PY
      - name: Check JavaScript syntax
        run: node --check /tmp/nika-inline.js
