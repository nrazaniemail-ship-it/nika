name: Build Nika Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'gradle.properties'
      - 'index.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'icon.jpg'
      - 'vendor/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nika-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bundle Nika web app into Android assets root
        shell: bash
        run: |
          set -euo pipefail
          ASSETS="app/src/main/assets"
          mkdir -p "$ASSETS/vendor"
          rm -rf "$ASSETS/www"
          cp index.html manifest.webmanifest sw.js icon.svg icon.jpg "$ASSETS/"
          cp vendor/xlsx.full.min.js "$ASSETS/vendor/"
          test -s "$ASSETS/index.html"
          test -s "$ASSETS/manifest.webmanifest"
          test -s "$ASSETS/sw.js"
          test -s "$ASSETS/icon.svg"
          test -s "$ASSETS/icon.jpg"
          test -s "$ASSETS/vendor/xlsx.full.min.js"
          echo "Bundled files:"
          find "$ASSETS" -maxdepth 2 -type f -printf '%p %s bytes\\n'

      - name: Build debug APK
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Verify APK contains local web app
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -E 'assets/(index.html|manifest.webmanifest|sw.js|icon.svg|icon.jpg|vendor/xlsx.full.min.js)$'
          unzip -p "$APK" assets/index.html | grep -q '<html'
          unzip -p "$APK" assets/vendor/xlsx.full.min.js | grep -q 'xlsx.js'
          echo "APK_SIZE=$(stat -c%s "$APK")" >> "$GITHUB_ENV"
          sha256sum "$APK" | tee app/build/outputs/apk/debug/SHA256SUMS.txt
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Nika-1.0.0-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
